name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check apps/ voyant_project/ tests/
      - name: Format check
        run: ruff format --check apps/ voyant_project/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-django pytest-env
      - name: Run tests with coverage
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=50 -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: Security scan
        run: pip-audit --desc

  doc-truth:
    runs-on: ubuntu-latest
    env:
      VOYANT_ENV: local
      DATABASE_URL: postgresql://voyant:voyant@localhost:45432/voyant_test
      VOYANT_SECRET_KEY: test-secret-key-for-testing-only-min-50-chars-long-django-security
      VOYANT_SECRETS_BACKEND: env
      VOYANT_SECURITY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Regenerate OpenAPI spec
        run: python manage.py export_openapi
      - name: Check committed OpenAPI spec is up to date
        run: git diff --exit-code docs/api/openapi.json
      - name: Check documentation truth
        run: python scripts/verification/check_doc_truth.py
      - name: Verify doc counts against config
        run: python scripts/verification/verify_doc_counts.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: bunx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: dashboard
        run: bun run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: dashboard/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        run: docker build -f infra/standalone/Dockerfile -t voyant-api:ci .
