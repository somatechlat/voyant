# =============================================================================
# VOYANT STANDALONE - Docker Compose (Production-Ready)
# =============================================================================
# Version: 3.1.0
# Mode: STANDALONE - Full infrastructure, persistent volumes
# Cluster: voyant_cluster
# Port Range: 45xxx
#
# SECURITY ARCHITECTURE:
#   - NO secrets in .env files.
#   - NO hardcoded credentials anywhere in this file.
#   - All secrets are injected via Docker secrets mounted at /run/secrets.
#   - Secrets source: ./secrets/ directory (generated by bootstrap-env.sh).
#   - Application containers read secrets from Vault at runtime.
#   - Infrastructure containers use load-secrets.sh to bootstrap from files.
#
# Usage:
#   cd infra/standalone
#   ./scripts/bootstrap-env.sh
#   docker compose up -d
#
# =============================================================================

name: voyant_cluster

x-common: &common
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "100m"
      max-file: "10"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 60s

services:
  # ===========================================================================
  # CORE: Voyant API
  # ===========================================================================
  voyant_api:
    <<: *common
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
      args:
        VOYANT_TORCH_DEVICE: ${VOYANT_TORCH_DEVICE}
        PYTORCH_INDEX_URL_CPU: ${PYTORCH_INDEX_URL_CPU}
        PYTORCH_INDEX_URL_CUDA: ${PYTORCH_INDEX_URL_CUDA}
    container_name: voyant_api
    ports:
      - "45000:8000"
    depends_on:
      voyant_postgres:
        condition: service_healthy
      voyant_redis:
        condition: service_healthy
      voyant_kafka:
        condition: service_started
      voyant_vault:
        condition: service_started
    env_file:
      - ./.env
    environment:
      VOYANT_ENV: ${VOYANT_ENV}
      VOYANT_DEBUG: ${VOYANT_DEBUG}
      VOYANT_SECRETS_BACKEND: ${VOYANT_SECRETS_BACKEND}
      VOYANT_DEPLOYMENT_MODE: ${VOYANT_DEPLOYMENT_MODE}
      VOYANT_ALLOWED_HOSTS: ${VOYANT_ALLOWED_HOSTS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      VOYANT_SECRETS_VAULT_URL: "http://voyant_vault:8200"
      VOYANT_SECRETS_VAULT_TOKEN_FILE: /run/secrets/vault_token
      VOYANT_SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      VOYANT_MCP_API_TOKEN_FILE: /run/secrets/mcp_api_token
      VOYANT_SPICEDB_GRPC_PRESHARED_KEY_FILE: /run/secrets/spicedb_grpc_preshared_key
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL}
      VOYANT_TRINO_HOST: voyant_trino
      VOYANT_TRINO_PORT: 8080
      VOYANT_TRINO_USER: voyant
      VOYANT_TRINO_CATALOG: iceberg
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      TEMPORAL_HOST: ${TEMPORAL_HOST}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE}
      VOYANT_ENABLE_QUALITY: ${VOYANT_ENABLE_QUALITY}
      VOYANT_ENABLE_BILLING: ${VOYANT_ENABLE_BILLING}
      VOYANT_ENABLE_DATAHUB: ${VOYANT_ENABLE_DATAHUB}
      VOYANT_MCP_API_URL: ${VOYANT_MCP_API_URL}
    secrets:
      - secret_key
      - database_url
      - redis_url
      - minio_access_key
      - minio_secret_key
      - keycloak_client_secret
      - vault_token
      - spicedb_grpc_preshared_key
      - mcp_api_token
    volumes:
      - ../../apps:/app/apps
      - ../../admin:/app/admin
      - ../../voyant_project:/app/voyant_project
      - ../../manage.py:/app/manage.py
      - ../../scripts:/app/scripts
      - ../../tests:/app/tests
      - ../../conftest.py:/app/conftest.py
      - voyant_artifacts:/app/artifacts
      - voyant_data:/app/data
      - voyant_logs:/app/logs
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthz" ]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - voyant_cluster

  voyant_worker:
    <<: *common
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile
      args:
        VOYANT_WITH_TRANSCRIBE: ${VOYANT_WITH_TRANSCRIBE}
        VOYANT_TORCH_DEVICE: ${VOYANT_TORCH_DEVICE}
        PYTORCH_INDEX_URL_CPU: ${PYTORCH_INDEX_URL_CPU}
        PYTORCH_INDEX_URL_CUDA: ${PYTORCH_INDEX_URL_CUDA}
    container_name: voyant_worker
    command: [ "python", "-m", "apps.worker.worker_main" ]
    ports:
      - "45090:9090"
    env_file:
      - ./.env
    environment:
      DJANGO_SETTINGS_MODULE: voyant_project.settings
      VOYANT_SECRETS_VAULT_URL: "http://voyant_vault:8200"
      VOYANT_SECRETS_VAULT_TOKEN_FILE: /run/secrets/vault_token
      VOYANT_SECRET_KEY_FILE: /run/secrets/secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio_access_key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/keycloak_client_secret
      VOYANT_MCP_API_TOKEN_FILE: /run/secrets/mcp_api_token
      VOYANT_SPICEDB_GRPC_PRESHARED_KEY_FILE: /run/secrets/spicedb_grpc_preshared_key
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TEMPORAL_HOST: ${TEMPORAL_HOST}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL}
      VOYANT_TRINO_HOST: voyant_trino
      VOYANT_TRINO_PORT: 8080
      VOYANT_TRINO_USER: voyant
      VOYANT_TRINO_CATALOG: iceberg
    secrets:
      - secret_key
      - database_url
      - redis_url
      - minio_access_key
      - minio_secret_key
      - keycloak_client_secret
      - vault_token
      - spicedb_grpc_preshared_key
      - mcp_api_token
    depends_on:
      voyant_redis:
        condition: service_healthy
      voyant_postgres:
        condition: service_healthy
      voyant_temporal:
        condition: service_started
    volumes:
      - ../../apps:/app/apps
      - ../../admin:/app/admin
      - ../../voyant_project:/app/voyant_project
      - ../../manage.py:/app/manage.py
      - ../../scripts:/app/scripts
      - ../../tests:/app/tests
      - voyant_artifacts:/app/artifacts
      - voyant_data:/app/data
      - voyant_logs:/app/logs
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:9090/metrics" ]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - voyant_cluster

  # ===========================================================================
  # DATA INFRASTRUCTURE
  # ===========================================================================
  voyant_postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: voyant_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "45432:5432"
    volumes:
      - voyant_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "pg_isready -U voyant" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      voyant_cluster:
        aliases:
          - voyant-postgres

  voyant_redis:
    <<: *common
    image: redis:7-alpine
    container_name: voyant_redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        REDIS_PASS=$$(cat /run/secrets/redis_password)
        exec redis-server --requirepass "$$REDIS_PASS" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    ports:
      - "45379:6379"
    volumes:
      - voyant_redis_data:/data
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "redis-cli -a $(cat /run/secrets/redis_password) ping" ]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - voyant_cluster

  voyant_kafka:
    <<: *common
    image: apache/kafka:3.7.0
    container_name: voyant_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@voyant_kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "45092:9092"
    volumes:
      - voyant_kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - voyant_cluster

  voyant_minio:
    <<: *common
    image: minio/minio:latest
    container_name: voyant_minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ROOT_USER=$$(cat /run/secrets/minio_root_user)
        export MINIO_ROOT_PASSWORD=$$(cat /run/secrets/minio_root_password)
        exec minio server /data --console-address ":9001"
    secrets:
      - minio_root_user
      - minio_root_password
    ports:
      - "45900:9000"
      - "45901:9001"
    volumes:
      - voyant_minio_data:/data
    healthcheck:
      <<: *healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  voyant_minio_init:
    image: minio/mc
    container_name: voyant_minio_init
    depends_on:
      voyant_minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      USER=$(cat /run/secrets/minio_root_user);
      PASS=$(cat /run/secrets/minio_root_password);
      mc alias set minio http://voyant_minio:9000 $USER $PASS;
      mc mb minio/artifacts --ignore-existing;
      mc mb minio/warehouse --ignore-existing;
      mc mb minio/staging --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_INTERNAL_URL: ${MINIO_INTERNAL_URL:-http://voyant_minio:9000}
    secrets:
      - minio_root_user
      - minio_root_password
    networks:
      - voyant_cluster

  voyant_searxng:
    <<: *common
    image: searxng/searxng:latest
    container_name: voyant_searxng
    ports:
      - "45088:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    secrets:
      - searxng_secret
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    entrypoint: ["/bin/sh", "-c", "export SEARXNG_SECRET=$(cat /run/secrets/searxng_secret) && exec /usr/local/searxng/entrypoint.sh"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  # ===========================================================================
  # TEMPORAL (Workflow Orchestration)
  # ===========================================================================
  voyant_temporal:
    <<: *common
    image: temporalio/auto-setup:1.24.2
    container_name: voyant_temporal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export POSTGRES_PWD=$$(cat /run/secrets/postgres_password)
        exec /etc/temporal/entrypoint.sh autosetup
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SEEDS: ${POSTGRES_HOST}
    secrets:
      - postgres_password
    ports:
      - "45233:7233"
    depends_on:
      voyant_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - voyant_cluster

  voyant_temporal_ui:
    <<: *common
    image: temporalio/ui:latest
    container_name: voyant_temporal_ui
    environment:
      - TEMPORAL_ADDRESS=voyant_temporal:7233
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS}
    ports:
      - "45089:8080"
    depends_on:
      - voyant_temporal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - voyant_cluster

  # ===========================================================================
  # ANALYTICS (Trino)
  # ===========================================================================
  voyant_trino:
    <<: *common
    image: trinodb/trino:434
    container_name: voyant_trino
    ports:
      - "45080:8080"
    volumes:
      - ./config/trino:/etc/trino:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - voyant_cluster

  # ===========================================================================
  # GOVERNANCE (DataHub)
  # ===========================================================================
  voyant_elasticsearch:
    <<: *common
    image: elasticsearch:7.17.16
    container_name: voyant_elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.security.enabled: "false"
    ports:
      - "45200:9200"
    volumes:
      - voyant_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - voyant_cluster

  voyant_datahub_gms:
    <<: *common
    image: linkedin/datahub-gms:v0.12.1
    container_name: voyant_datahub_gms
    profiles: [ "datahub" ]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export EBEAN_DATASOURCE_PASSWORD=$$(cat /run/secrets/postgres_password)
        exec /bin/start-gms.sh
    environment:
      DATAHUB_GMS_PORT: "8080"
      EBEAN_DATASOURCE_HOST: voyant_postgres:5432
      EBEAN_DATASOURCE_USERNAME: ${POSTGRES_USER}
      KAFKA_BOOTSTRAP_SERVER: voyant_kafka:9092
      ELASTICSEARCH_HOST: voyant_elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ENTITY_REGISTRY_CONFIG_PATH: /datahub/datahub-gms/resources/entity-registry.yml
      SKIP_NEO4J_CHECK: "true"
      JAVA_OPTS: -Xms256m -Xmx512m
    secrets:
      - postgres_password
    ports:
      - "45081:8080"
    depends_on:
      voyant_postgres:
        condition: service_healthy
      voyant_kafka:
        condition: service_started
      voyant_elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      voyant_cluster:
        aliases:
          - voyant-datahub-gms

  voyant_datahub_frontend:
    <<: *common
    image: linkedin/datahub-frontend-react:v0.12.1
    container_name: voyant_datahub_frontend
    profiles: [ "datahub" ]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DATAHUB_SECRET=$$(cat /run/secrets/datahub_secret)
        exec /bin/start-frontend.sh
    environment:
      DATAHUB_GMS_HOST: voyant-datahub-gms
      DATAHUB_GMS_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVER: voyant_kafka:9092
    secrets:
      - datahub_secret
    ports:
      - "45002:9002"
    depends_on:
      - voyant_datahub_gms
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - voyant_cluster

  # ===========================================================================
  # SECURITY (Vault & Keycloak)
  # ===========================================================================
  voyant_vault:
    <<: *common
    image: hashicorp/vault:1.15
    container_name: voyant_vault
    cap_add:
      - IPC_LOCK
    ports:
      - "45820:8200"
    environment:
      # Dev-mode only: Vault -dev flag requires a root token ID.
      # This is NOT a production secret — dev Vault has no real unsealing.
      # Production Vault uses auto-unseal + AppRole/Kubernetes auth.
      VAULT_DEV_ROOT_TOKEN_ID: "voyant-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    volumes:
      - voyant_vault_data:/vault/file
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  voyant_spicedb:
    <<: *common
    build:
      context: ../..
      dockerfile: infra/standalone/Dockerfile.spicedb
    container_name: voyant_spicedb
    command: ["--datastore-engine", "memory"]
    ports:
      - "50051:50051"
      - "50052:50052"
      - "8443:8443"
    secrets:
      - spicedb_grpc_preshared_key
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          memory: 48M
    networks:
      - voyant_cluster

  voyant_keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:23.0
    container_name: voyant_keycloak
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export KC_DB_PASSWORD=$$(cat /run/secrets/postgres_password)
        export KEYCLOAK_ADMIN_PASSWORD=$$(cat /run/secrets/keycloak_admin_password)
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://voyant_postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-voyant-admin}
    secrets:
      - postgres_password
      - keycloak_admin_password
    ports:
      - "45180:8080"
    volumes:
      - ./config/keycloak/realm-voyant.json:/opt/keycloak/data/import/realm-voyant.json:ro
    depends_on:
      voyant_postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [ "CMD-SHELL", "bash -c ':</dev/tcp/127.0.0.1/8080'" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  # ===========================================================================
  # STREAMING (Apache Flink)
  # ===========================================================================
  voyant_flink_jobmanager:
    <<: *common
    image: flink:1.18.1-java17
    container_name: voyant_flink_jobmanager
    command: jobmanager
    ports:
      - "45082:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: voyant_flink_jobmanager
    volumes:
      - voyant_flink_data:/opt/flink/volume
    networks:
      - voyant_cluster
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  voyant_flink_taskmanager:
    <<: *common
    image: flink:1.18.1-java17
    container_name: voyant_flink_taskmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: voyant_flink_jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - voyant_flink_data:/opt/flink/volume
    depends_on:
      voyant_flink_jobmanager:
        condition: service_healthy
    networks:
      - voyant_cluster
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

  # ===========================================================================
  # VECTOR DATABASE (Milvus 2.4+)
  # ===========================================================================
  voyant_etcd:
    <<: *common
    container_name: voyant_etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - voyant_etcd_data:/etcd
    command: >
      etcd -advertise-client-urls http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "etcdctl", "endpoint", "health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  voyant_milvus:
    <<: *common
    container_name: voyant_milvus
    image: milvusdb/milvus:v2.4.17
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export MINIO_ACCESS_KEY_ID=$$(cat /run/secrets/minio_access_key)
        export MINIO_SECRET_ACCESS_KEY=$$(cat /run/secrets/minio_secret_key)
        exec milvus run standalone
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: voyant_etcd:2379
      MINIO_ADDRESS: voyant_minio:9000
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - voyant_milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      voyant_etcd:
        condition: service_healthy
      voyant_minio:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - voyant_cluster

  # ===========================================================================
  # ANTI-BOT BYPASS (FlareSolverr)
  # ===========================================================================
  voyant_flaresolverr:
    <<: *common
    container_name: voyant_flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    ports:
      - "45191:8191"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - voyant_cluster

  # ===========================================================================
  # MANAGED BROWSER POOL (Browserless)
  # ===========================================================================
  voyant_browserless:
    <<: *common
    container_name: voyant_browserless
    image: ghcr.io/browserless/chromium:latest
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - PREBOOT_CHROME=true
    ports:
      - "45300:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - voyant_cluster

# =============================================================================
# NETWORK: voyant_cluster
# =============================================================================
networks:
  voyant_cluster:
    driver: bridge
    name: voyant_cluster

# =============================================================================
# DOCKER SECRETS (mounted at /run/secrets/<name>)
# =============================================================================
secrets:
  secret_key:
    file: ./secrets/secret_key
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  minio_access_key:
    file: ./secrets/minio_access_key
  minio_secret_key:
    file: ./secrets/minio_secret_key
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  keycloak_client_secret:
    file: ./secrets/keycloak_client_secret
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  spicedb_grpc_preshared_key:
    file: ./secrets/spicedb_grpc_preshared_key
  vault_token:
    file: ./secrets/vault_token
  datahub_secret:
    file: ./secrets/datahub_secret
  mcp_api_token:
    file: ./secrets/mcp_api_token
  searxng_secret:
    file: ./secrets/searxng_secret

# =============================================================================
# PERSISTENT VOLUMES (Production-Resilient)
# =============================================================================
volumes:
  voyant_postgres_data:
    name: voyant_postgres_data
  voyant_redis_data:
    name: voyant_redis_data
  voyant_kafka_data:
    name: voyant_kafka_data
  voyant_minio_data:
    name: voyant_minio_data
  voyant_elasticsearch_data:
    name: voyant_elasticsearch_data
  voyant_artifacts:
    name: voyant_artifacts
  voyant_data:
    name: voyant_data
  voyant_flink_data:
    name: voyant_flink_data
  voyant_logs:
    name: voyant_logs
  voyant_vault_data:
    name: voyant_vault_data
  voyant_etcd_data:
    name: voyant_etcd_data
  voyant_milvus_data:
    name: voyant_milvus_data
