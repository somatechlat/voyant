# Voyant Dashboard — nginx site config (mounted as /etc/nginx/conf.d/default.conf)
# Serves the built SPA and reverse-proxies API/MCP/WebSocket traffic to voyant_api.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Resolve the API container through Docker's embedded DNS at request time.
    # A variable proxy_pass defers resolution, so nginx still starts when
    # voyant_api is down and picks up container recreations without a reload.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $voyant_api http://voyant_api:8000;

    # Django Ninja API (mounted at /v1)
    location /v1/ {
        proxy_pass $voyant_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Matches the Vite dev proxy: tells Django the request is "secure"
        # so its SSL redirect does not fire behind the proxy.
        proxy_set_header X-Forwarded-Proto https;
    }

    # MCP server (mounted at /mcp in voyant_project/asgi.py)
    location /mcp {
        proxy_pass $voyant_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # MCP uses long-lived streamed responses.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # WebSockets (e.g. /ws/scraper/ — see voyant_project/asgi.py)
    location /ws/ {
        proxy_pass $voyant_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
